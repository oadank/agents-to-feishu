<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运行时管理</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a212b; --border: #3d4b6a; --text: #e6e9ef; --dim: #9aa3ad;
      --accent: #4b6fff; --ok: #34c759; --err: #ff5f57;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .rthead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rt-name { font-weight: 700; font-size: 14px; min-width: 100px; }
    .tag { font-size: 11px; border-radius: 5px; padding: 1px 8px; border: 1px solid var(--border); color: var(--dim); white-space: nowrap; }
    .tag.ok { color: var(--ok); border-color: rgba(52,199,89,.4); }
    .tag.err { color: var(--err); border-color: rgba(255,95,87,.4); }
    .tag.info { color: var(--accent); border-color: rgba(75,111,255,.4); }
    .row { margin: 8px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row.kv { font-size: 12px; }
    .row .k { color: var(--dim); white-space: nowrap; }
    .row .v { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; color: var(--text); word-break: break-all; }
    .path-input { flex: 1 1 260px; min-width: 200px; background: #0f1419; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: "Cascadia Code", Consolas, monospace; }
    .btn { background: rgba(128,128,128,.15); border: none; border-radius: 6px; color: var(--text); padding: 4px 12px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: rgba(128,128,128,.28); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
    .ok { color: var(--ok); }
    .dim { color: var(--dim); font-size: 12px; }
    .hint { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
    .env-box { margin-top: 10px; padding: 10px 12px; background: rgba(75,111,255,.06); border: 1px solid rgba(75,111,255,.25); border-radius: 8px; }
    .env-title { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
    .env-hint { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
    /* 开关 */
    .switch { position: relative; display: inline-block; width: 36px; height: 19px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: rgba(128,128,128,.3); border-radius: 20px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 13px; width: 13px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(17px); }
    .divider { height: 1px; background: var(--border); margin: 10px 0; }
    .note-box { background: rgba(75,111,255,.08); border: 1px solid rgba(75,111,255,.3); border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-bottom: 14px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="./assets/vendor/preact.js"></script>
  <script src="./assets/vendor/preact-hooks.js"></script>
  <script src="./runtimes-settings.js"></script>
</body>
</html>
