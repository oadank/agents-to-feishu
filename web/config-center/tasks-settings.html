<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队任务账</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a212b; --border: #3d4b6a; --text: #e6e9ef; --dim: #9aa3ad;
      --accent: #4b6fff; --ok: #34c759; --err: #ff5f57; --warn: #f5a623;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 18px 40px; }
    h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; align-items: center; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); flex: 1 1 180px; min-width: 150px; }
    input[type=text], select, textarea {
      background: #0f1419; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 12.5px; width: 100%; font-family: inherit;
    }
    .btn { background: rgba(128,128,128,.15); border: none; border-radius: 6px; color: var(--text); padding: 5px 12px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: rgba(128,128,128,.28); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.mini { padding: 2px 8px; font-size: 11px; font-weight: 500; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat { background: #0f1419; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-width: 74px; }
    .stat b { display: block; font-size: 17px; }
    .stat span { color: var(--dim); font-size: 11px; }
    .alerts { display: flex; flex-direction: column; gap: 6px; }
    .alert { border-left: 3px solid var(--warn); background: rgba(245,166,35,.08); padding: 6px 10px; border-radius: 0 6px 6px 0; font-size: 12px; }
    .alert.bad { border-left-color: var(--err); background: rgba(255,95,87,.1); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #2a3346; vertical-align: top; }
    th { color: var(--dim); font-weight: 600; font-size: 11.5px; position: sticky; top: 0; background: var(--card); }
    tr:hover td { background: rgba(255,255,255,.025); }
    .id { font-family: Consolas, monospace; color: var(--accent); white-space: nowrap; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; border: 1px solid var(--border); }
    .pill.todo { color: var(--dim); }
    .pill.doing { color: #7fb3ff; border-color: #3b6ea8; background: rgba(75,111,255,.12); }
    .pill.review { color: var(--warn); border-color: #7a5a1e; background: rgba(245,166,35,.12); }
    .pill.done { color: var(--ok); border-color: #2c6b3c; background: rgba(52,199,89,.12); }
    .pill.blocked { color: var(--err); border-color: #7a3030; background: rgba(255,95,87,.12); }
    .dim { color: var(--dim); } .err { color: var(--err); } .ok { color: var(--ok); } .warn { color: var(--warn); }
    .rev { font-family: Consolas, monospace; color: var(--dim); }
    .msg { min-height: 20px; font-size: 12px; white-space: pre-wrap; }
    .hist { margin-top: 6px; padding-left: 14px; color: var(--dim); font-size: 11.5px; }
    details summary { cursor: pointer; color: var(--dim); font-size: 11.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📋 团队任务账</h1>
    <div class="sub">一本账 · 版本号 · 状态机：派活先建账拿号，领活看地盘撞不撞车，交活必须留证据。状态不许悄悄倒退。</div>

    <div class="card"><div class="stats" id="stats"></div></div>
    <div class="card"><div class="alerts" id="alerts"></div></div>

    <div class="card">
      <b>建账（派活先拿号）</b>
      <div class="row">
        <label class="field">要干什么（一句话）<input type="text" id="n-title" placeholder="例：给任务账加冲突看板"></label>
        <label class="field">地盘（shard，撞车判定靠它）<input type="text" id="n-shard" placeholder="例：config-center / openmem / repo:xxx"></label>
        <label class="field">负责人<input type="text" id="n-owner" placeholder="例：codex"></label>
        <label class="field">幂等号（重复派活拦下用）<input type="text" id="n-dedupe" placeholder="留空则不查重"></label>
      </div>
      <div class="row">
        <label class="field" style="flex:1 1 100%">意图（说清要动哪块、动成什么样，别塞成品全文）<input type="text" id="n-intent"></label>
        <button class="btn primary" id="n-create">建账</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <label class="field" style="flex:0 0 130px">状态
          <select id="f-status"><option value="">全部</option><option>todo</option><option>doing</option><option>review</option><option>blocked</option><option>done</option></select>
        </label>
        <label class="field" style="flex:0 0 150px">负责人<input type="text" id="f-owner" placeholder="留空=全部"></label>
        <label class="field" style="flex:0 0 180px">地盘<input type="text" id="f-shard" placeholder="留空=全部"></label>
        <label class="field" style="flex:0 0 110px">操作人<input type="text" id="me" placeholder="你叫什么"></label>
        <button class="btn" id="f-refresh">刷新</button>
        <span class="dim" id="autorev">自动刷新：开</span>
        <span class="dim">全局版本 <b id="grev" class="rev">-</b></span>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>号 / 版本</th><th>要干什么</th><th>地盘</th><th>负责人</th><th>状态</th><th>更新</th><th>证据 / 动作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script src="./tasks-settings.js"></script>
</body>
</html>
