<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注入配置</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a212b; --border: #3d4b6a; --text: #e6e9ef; --dim: #9aa3ad;
      --accent: #4b6fff; --ok: #34c759; --err: #ff5f57;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 18px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: center; }
    textarea {
      background: #0f1419; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
      font-size: 12.5px; width: 100%; font-family: "Cascadia Code", Consolas, monospace; line-height: 1.6; resize: vertical;
    }
    .btn { background: rgba(128,128,128,.15); border: none; border-radius: 6px; color: var(--text); padding: 5px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: rgba(128,128,128,.28); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .dim { color: var(--dim); font-size: 12px; }
    .ok { color: var(--ok); }
    .err { color: var(--err); font-size: 12px; }
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: rgba(128,128,128,.3); border-radius: 20px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(18px); }
    .tip { background: rgba(75,111,255,.08); border: 1px solid rgba(75,111,255,.25); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--dim); line-height: 1.7; }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="./assets/vendor/preact.js"></script>
  <script src="./assets/vendor/preact-hooks.js"></script>
  <script src="./inject-settings.js"></script>
</body>
</html>
