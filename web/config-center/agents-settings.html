<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 分配置</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a212b; --border: #3d4b6a; --text: #e6e9ef; --dim: #9aa3ad;
      --accent: #4b6fff; --ok: #34c759; --err: #ff5f57; --warn: #f5a623;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 18px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    /* 卡片式布局（与 Agent 概览同款） */
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1200px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .acard { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; }
    .acard.off { opacity: .65; }
    .ahead { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .line { font-size: 12.5px; color: var(--dim); margin: 3px 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
    .line b { color: var(--text); font-weight: 600; }
    .line .ok { color: var(--ok); }
    .line .warn { color: var(--warn); }
    .line-k { flex: none; font-size: 12px; min-width: 16px; white-space: nowrap; }
    .actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; padding-top: 10px; }
    .sub { font-size: 11px; color: var(--dim); }
    .tag { font-size: 10.5px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--border); color: var(--dim); display: inline-block; margin: 1px 2px 1px 0; }
    .tag.ok { color: var(--ok); border-color: rgba(52,199,89,.4); }
    .tag.off { color: var(--dim); }
    .btn { background: rgba(128,128,128,.15); border: none; border-radius: 6px; color: var(--text); padding: 4px 12px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: rgba(128,128,128,.28); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.danger { background: rgba(255,95,87,.15); color: #ff5f57; }
    .btn.warn { background: rgba(245,166,35,.15); color: var(--warn); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.mini { padding: 2px 8px; font-size: 11px; }
    .dim { color: var(--dim); font-size: 12px; }
    .err { color: var(--err); font-size: 12px; }
    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    /* 模态 */
    .mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 620px; max-width: 94vw; max-height: 88vh; overflow: auto; padding: 14px 16px; }
    .modal h2 { font-size: 15px; margin: 0 0 10px; }
    .close { float: right; cursor: pointer; color: var(--dim); font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; align-items: center; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); flex: 1 1 45%; min-width: 170px; }
    label.field.wide { flex: 1 1 100%; }
    input[type=text], input[type=password], input[type=number], select, textarea {
      background: #0f1419; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; width: 100%; font-family: inherit;
    }
    textarea { resize: vertical; }
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: rgba(128,128,128,.3); border-radius: 20px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(18px); }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; }
    .checks label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); cursor: pointer; }
    .checks input { accent-color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="./assets/vendor/preact.js"></script>
  <script src="./assets/vendor/preact-hooks.js"></script>
  <script src="./agents-settings.js"></script>
</body>
</html>
