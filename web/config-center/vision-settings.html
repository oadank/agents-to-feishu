<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>看图配置</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a212b; --border: #3d4b6a; --text: #e6e9ef; --dim: #9aa3ad;
      --accent: #4b6fff; --ok: #34c759; --err: #ff5f57;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 18px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
    /* 响应式两栏：全屏左右并排，窄屏上下堆叠 */
    .cols { display: flex; flex-direction: column; gap: 14px; }
    .cols > div { flex: 1 1 0; min-width: 0; }
    @media (min-width: 1100px) {
      .cols { flex-direction: row; align-items: flex-start; }
    }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: center; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); flex: 1 1 45%; min-width: 200px; }
    input[type=text], input[type=password], input[type=number], select, textarea {
      background: #0f1419; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; width: 100%; font-family: inherit;
    }
    textarea { resize: vertical; }
    .btn { background: rgba(128,128,128,.15); border: none; border-radius: 6px; color: var(--text); padding: 5px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: rgba(128,128,128,.28); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .dim { color: var(--dim); font-size: 12px; }
    .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
    .ok { color: var(--ok); }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .segment { display: flex; gap: 4px; background: rgba(128,128,128,.12); border-radius: 8px; padding: 3px; }
    .segment button { background: transparent; border: none; color: var(--dim); padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .segment button.active { background: var(--accent); color: #fff; font-weight: 600; }
    .preview { border: 1px solid var(--border); border-radius: 8px; max-width: 100%; }
    .result { background: #0f1419; border: 1px solid var(--border); border-radius: 8px; padding: 10px; white-space: pre-wrap; font-size: 12px; color: var(--text); max-height: 260px; overflow: auto; }
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: rgba(128,128,128,.3); border-radius: 20px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="./assets/vendor/preact.js"></script>
  <script src="./assets/vendor/preact-hooks.js"></script>
  <script src="./vision-settings.js"></script>
</body>
</html>
