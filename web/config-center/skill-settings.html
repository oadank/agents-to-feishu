<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能库设置</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a212b; --border: #3d4b6a; --text: #e6e9ef; --dim: #9aa3ad;
      --accent: #4b6fff; --ok: #34c759; --err: #ff5f57;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 18px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .card-header { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .card-header .title { font-weight: 600; font-size: 14px; }
    .card-header .chev { margin-left: auto; color: var(--dim); font-size: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: center; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); flex: 1 1 45%; min-width: 200px; }
    input[type=text], input[type=password], select, textarea {
      background: #0f1419; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; width: 100%; font-family: inherit;
    }
    textarea { resize: vertical; }
    .btn { background: rgba(128,128,128,.15); border: none; border-radius: 6px; color: var(--text); padding: 5px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: rgba(128,128,128,.28); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.danger { background: rgba(255,95,87,.15); color: #ff5f57; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .skill-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed rgba(90,102,122,.3); }
    .skill-row:last-child { border-bottom: none; }
    .skill-main { flex: 1; min-width: 0; }
    .skill-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .skill-desc { color: var(--dim); font-size: 11.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { font-size: 10.5px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--border); color: var(--dim); }
    .tag.ok { color: var(--ok); border-color: rgba(52,199,89,.4); }
    .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
    .ok { color: var(--ok); }
    .dim { color: var(--dim); font-size: 12px; }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    /* 开关 */
    .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: rgba(128,128,128,.3); border-radius: 20px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(18px); }
    /* 模态编辑器 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 10px; width: 90%; max-width: 720px; max-height: 88vh; display: flex; flex-direction: column; }
    .modal-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .modal-head .close { margin-left: auto; cursor: pointer; color: var(--dim); }
    .modal-body { padding: 14px 16px; overflow: auto; flex: 1; }
    .modal-foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
    .market-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed rgba(90,102,122,.3); }
    .search-box { width: 100%; }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="./assets/vendor/preact.js"></script>
  <script src="./assets/vendor/preact-hooks.js"></script>
  <script src="./skill-settings.js"></script>
</body>
</html>
