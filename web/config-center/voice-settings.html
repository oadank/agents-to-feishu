<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音设置</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a212b; --border: #3d4b6a; --text: #e6e9ef; --dim: #9aa3ad;
      --accent: #4b6fff; --ok: #34c759; --err: #ff5f57;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 13px; line-height: 1.6; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
    /* 响应式两栏：全屏引擎配置 + ASR 左右并排，窄屏上下堆叠 */
    .cols { display: flex; flex-direction: column; gap: 14px; }
    .cols > div { flex: 1 1 0; min-width: 0; }
    @media (min-width: 1100px) {
      .cols { flex-direction: row; align-items: flex-start; }
    }
    h1 { font-size: 18px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
    h1 .btn-back { background: rgba(128,128,128,.12); border: none; border-radius: 6px; color: var(--text); cursor: pointer; padding: 3px 10px; font-size: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .card-header { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .card-header .title { font-weight: 600; font-size: 14px; }
    .card-header .chev { margin-left: auto; color: var(--dim); font-size: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: center; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); flex: 1 1 45%; min-width: 200px; }
    input[type=text], input[type=password], select, textarea {
      background: #0f1419; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; width: 100%; font-family: inherit;
    }
    textarea { resize: vertical; }
    .btn { background: rgba(128,128,128,.15); border: none; border-radius: 6px; color: var(--text); padding: 5px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: rgba(128,128,128,.28); }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .sample-row, .clone-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed rgba(90,102,122,.3); }
    .sample-row .name, .clone-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    audio { width: 100%; height: 34px; margin-top: 8px; }
    .dim { color: var(--dim); font-size: 12px; }
    .err { color: var(--err); font-size: 12px; white-space: pre-wrap; }
    .ok { color: var(--ok); }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .map { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="./assets/vendor/preact.js"></script>
  <script src="./assets/vendor/preact-hooks.js"></script>
  <script src="./voice-settings.js"></script>
</body>
</html>
